services:
  - type: worker
    name: bigspd-worker
    runtime: docker
    dockerfilePath: ./Dockerfile.worker
    dockerContext: .
    maxShutdownDelaySeconds: 60
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: OWNER_EMAIL
        sync: false
      - key: OWNER_PASSWORD_HASH
        sync: false
      - key: SETTINGS_ENCRYPTION_KEY
        sync: false
      - key: META_CLIENT_MODE
        value: live
      - key: META_API_VERSION
        value: v25.0
      - key: DEFAULT_COUNTRY_CODE
        value: "55"
      - key: WORKER_CONCURRENCY
        value: "5"
      - key: WORKER_MAX_PER_SECOND
        value: "5"
      - key: LOG_LEVEL
        value: info
